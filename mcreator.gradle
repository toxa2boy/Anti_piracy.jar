// Keep client mixins registered when MCreator regenerates neoforge.mods.toml.
tasks.named('processResources') {
    doLast {
        def descriptor = new File(destinationDir, 'META-INF/neoforge.mods.toml')
        def configName = 'anti_piracyjar.amano.mixins.json'
        if (!descriptor.exists()) {
            throw new GradleException('Missing processed neoforge.mods.toml')
        }
        def contents = descriptor.getText('UTF-8')
        if (!contents.contains('config="' + configName + '"') &&
                !contents.contains('config = "' + configName + '"')) {
            descriptor.append('\n[[mixins]]\nconfig="' + configName + '"\n', 'UTF-8')
        }
    }
}